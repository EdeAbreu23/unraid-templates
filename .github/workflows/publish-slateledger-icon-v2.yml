name: Publish SlateLedger icon v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-slateledger-icon-v2.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy icon to versioned filename
        run: cp images/slateledger-icon.png images/slateledger-icon-v2.png
      - name: Commit versioned icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/slateledger-icon-v2.png
          git commit -m "Add versioned SlateLedger Unraid icon"
          git push
